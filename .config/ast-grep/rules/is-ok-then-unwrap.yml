id: is-ok-then-unwrap
language: rust
severity: warning
rule:
  all:
    - pattern: |
        if $RES.is_ok() {
          $$$
        }
    - has:
        pattern: $RES.unwrap()
        stopBy: end
ignores:
  - "crates/**/tests/**"
  - "crates/**/benches/**"
  - "benches/**"
  - "tests/**"
  - "examples/**"
  - "tracehealth-api/tests/**"
  - "tracehealth-api/benches/**"
  - "vendor/**"
  - ".claude/worktrees/**"
  - "target/**"
  - "tracehealth-ios/**"
message: |
  `if r.is_ok()` + `r.unwrap()` — use `if let Ok(v) = r` to bind once.
note: |
  Replace:
    if res.is_ok() {
        ... res.unwrap() ...
    }
  with:
    if let Ok(v) = res {
        ... v ...
    }
  Binding once removes a panic site and lets the borrow checker reason
  about the inner value. The Option twin is [[is-some-then-unwrap]].
