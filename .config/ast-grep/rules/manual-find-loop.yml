id: manual-find-loop
language: rust
severity: warning
rule:
  all:
    - kind: expression_statement
    - has:
        pattern: |
          for $X in $ITER {
            if $COND {
              $FOUND = Some($VAL);
              break;
            }
          }
    - follows:
        pattern: let mut $FOUND = None;
constraints:
  X:
    kind: identifier
ignores:
  - "crates/**/tests/**"
  - "crates/**/benches/**"
  - "benches/**"
  - "tests/**"
  - "examples/**"
  - "tracehealth-api/tests/**"
  - "tracehealth-api/benches/**"
  - "vendor/**"
  - ".claude/worktrees/**"
  - "target/**"
  - "tracehealth-ios/**"
message: |
  Manual `find` loop — use `iter.find(...)` instead.
note: |
  Replace:
    let mut found = None;
    for x in iter {
      if pred(&x) {
        found = Some(x);
        break;
      }
    }
  with:
    let found = iter.find(|x| pred(x));
  If you only need a yes/no answer, `.any(...)` reads more directly than
  binding the value just to ignore it.
