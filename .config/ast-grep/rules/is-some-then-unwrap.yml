id: is-some-then-unwrap
language: rust
severity: warning
rule:
  all:
    - pattern: |
        if $OPT.is_some() {
          $$$
        }
    - has:
        pattern: $OPT.unwrap()
        stopBy: end
ignores:
  - "crates/**/tests/**"
  - "crates/**/benches/**"
  - "benches/**"
  - "tests/**"
  - "examples/**"
  - "tracehealth-api/tests/**"
  - "tracehealth-api/benches/**"
  - "vendor/**"
  - ".claude/worktrees/**"
  - "target/**"
  - "tracehealth-ios/**"
message: |
  `if x.is_some()` + `x.unwrap()` — use `if let Some(v) = x` to bind once.
note: |
  Replace:
    if opt.is_some() {
        ... opt.unwrap() ...
    }
  with:
    if let Some(v) = opt {
        ... v ...
    }
  Same shape for `Result`: prefer `if let Ok(v) = res` over `res.is_ok()`
  followed by `res.unwrap()`. Binding once removes the panic site and lets
  the borrow checker reason about the inner value.
