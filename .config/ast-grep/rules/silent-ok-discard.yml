id: silent-ok-discard
language: rust
severity: warning
rule:
  all:
    - pattern: $EXPR.ok()
    - inside:
        kind: expression_statement
        stopBy: neighbor
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: "cfg\\(test\\)"
ignores:
  - "crates/**/tests/**"
  - "crates/**/benches/**"
  - "benches/**"
  - "tests/**"
  - "examples/**"
  - "tracehealth-api/tests/**"
  - "tracehealth-api/benches/**"
  - "**/test_utils.rs"
  - "vendor/**"
  - ".claude/worktrees/**"
  - "target/**"
  - "tracehealth-ios/**"
message: |
  Silent .ok() discard — calling .ok() on a Result as a statement converts
  the error to None and drops it. If the operation can fail meaningfully,
  log the error or propagate with ?. If failure is truly ignorable, use
  `let _ = expr;` with a comment explaining why.
