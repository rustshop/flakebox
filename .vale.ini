MinAlertLevel = suggestion
StylesPath = .vale/styles
Vocab = Flakebox

# Lint the repository's documentation format. Generated entry points select only
# Git-tracked Markdown paths, excluding local build and dependency material.
[*.md]
BasedOnStyles = Vale
# Linked Specs IDs use this machine-stable lowercase slug.
TokenIgnores = (ARCH-flakebox(?:-nix-library)?)
